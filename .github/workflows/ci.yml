name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  format:
    name: Auto-format (ruff + black)
    runs-on: ubuntu-latest
    # Auto-commit only on main; PRs stay author-owned.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install formatters
        run: |
          pip install --upgrade pip
          pip install black ruff

      - name: Run ruff --fix
        run: ruff check pmi_analyzer/ tests/ --fix --exit-zero

      - name: Run black
        run: black pmi_analyzer/ tests/

      - name: Commit formatting changes (if any)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (
            git add pmi_analyzer/ tests/ &&
            git commit -m "style: auto-format via ruff + black [skip ci]"
          )
          git push

  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type check core modules (mypy)
        run: |
          mypy pmi_analyzer/calendar.py pmi_analyzer/data/loader.py \
            pmi_analyzer/updater/monthly_updater.py pmi_analyzer/scraper/batch_parser.py \
            --ignore-missing-imports

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short \
            --cov=pmi_analyzer \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
